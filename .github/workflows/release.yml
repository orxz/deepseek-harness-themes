name: Release

# Publishes both packages to npm when a version tag is pushed.
# Requires an NPM_TOKEN secret: create a Classic Automation token at
#   https://www.npmjs.com/settings/orxz/tokens → Generate New Token
#   → Classic Token → Automation (bypasses 2FA for CI/CD).
# Add it as a repository secret named NPM_TOKEN:
#   GitHub repo → Settings → Secrets and variables → Actions → New secret.
# Then: git tag v0.0.1 && git push origin v0.0.1

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true
      - run: pnpm test
      - run: pnpm build
      # Topological order: core first, then ui (which depends on core).
      - name: Publish packages
        run: pnpm -r publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
