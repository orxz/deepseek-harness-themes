name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Mints the OIDC identity npm trusted publishing verifies. This repository
  # stores no npm credential; the identity of this workflow is the credential.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No registry-url on purpose: it writes an npmrc whose authToken expands
      # from an env var, and an empty one stops npm falling through to OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node is older.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version), node $(node --version)"

      - run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          version-script: pnpm version:packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

      - name: Report release outcome
        if: always()
        run: |
          echo "published:         ${{ steps.changesets.outputs.published }}"
          echo "publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo "pullRequestNumber: ${{ steps.changesets.outputs.pullRequestNumber }}"
          echo
          echo "A 404 on publish means this workflow is not yet a trusted publisher."
          echo "Configure one per package at npmjs.com -> package -> Settings -> Trusted Publisher,"
          echo "naming repository orxz/deepseek-harness-themes and workflow release.yml."
