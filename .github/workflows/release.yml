name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # pnpm does not reliably pick up the npmrc actions/setup-node writes, so
      # point it at the token directly. User scope only: a project .npmrc would
      # be swept into the version commit.
      - name: Authenticate pnpm with npm
        run: pnpm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A publish PUT returns 404 both when the token is rejected and when the
      # scope is not ours. Name which half is missing before the release step
      # buries it in a generic "Not found".
      - name: Check npm identity and scope access
        run: |
          if identity=$(npm whoami 2>&1); then
            echo "npm identity: $identity"
          else
            echo "::warning title=npm auth::npm whoami failed, so publishing will 404: $identity"
          fi
          if ! npm access list packages @deepseek-harness-themes 2>&1; then
            echo "::warning title=npm scope::@deepseek-harness-themes is not writable by this token. Create the npm organisation, or grant the token access to it; every publish PUT 404s until then."
          fi

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          version-script: pnpm version:packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report release outcome
        if: always()
        run: |
          echo "published:         ${{ steps.changesets.outputs.published }}"
          echo "publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo "pullRequestNumber: ${{ steps.changesets.outputs.pullRequestNumber }}"
