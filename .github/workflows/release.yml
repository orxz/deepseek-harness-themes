name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # actions/setup-node writes `_authToken=${NODE_AUTH_TOKEN}`, a reference
      # resolved when npm reads the file — it is empty in any step that does not
      # also export that variable. Write the literal token into the same npmrc
      # instead, so every later step authenticates the same way.
      - name: Authenticate with npm
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=npm auth::The NPM_TOKEN secret is empty or not set on this repository."
            exit 1
          fi
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$npmrc"
          echo "wrote npm credentials to $npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A publish PUT returns 404 both when the token is rejected and when the
      # scope is not ours. Name which half is missing before the release step
      # buries it in a generic "Not found".
      - name: Check npm identity and scope access
        run: |
          if identity=$(npm whoami 2>&1); then
            echo "npm identity: $identity"
          else
            echo "::warning title=npm auth::npm whoami failed, so publishing will 404: $identity"
          fi
          if ! npm access list packages @dsh-themes 2>&1; then
            echo "::warning title=npm scope::@dsh-themes is not writable by this token. Add the token's account to the organisation with publish rights; every publish PUT 404s until then."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          version-script: pnpm version:packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report release outcome
        if: always()
        run: |
          echo "published:         ${{ steps.changesets.outputs.published }}"
          echo "publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo "pullRequestNumber: ${{ steps.changesets.outputs.pullRequestNumber }}"
